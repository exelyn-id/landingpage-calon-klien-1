<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WA Blast — 20 Calon Klien</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { margin: 0; background: #f0f2f5; color: #1c1e21; }
  header { background: #075e54; color: #fff; padding: 16px 20px; position: sticky; top: 0; z-index: 10; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.15); display: flex; flex-direction: column; }
  .card .top { display: flex; gap: 12px; padding: 12px; }
  .shot { width: 130px; flex-shrink: 0; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; background: #eee; align-self: flex-start; }
  .shot img { width: 100%; display: block; cursor: zoom-in; }
  .shot .none { padding: 20px 8px; font-size: 12px; color: #888; text-align: center; }
  .meta h2 { margin: 0 0 2px; font-size: 16px; }
  .meta .url { font-size: 12px; color: #007bff; word-break: break-all; }
  .meta .wa { font-size: 13px; color: #333; margin-top: 4px; }
  .msg { margin: 0 12px; padding: 10px; background: #dcf8c6; border-radius: 8px; font-size: 13px; white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
  .actions { display: flex; gap: 8px; padding: 12px; }
  .actions button, .actions a { flex: 1; text-align: center; font-size: 13px; font-weight: 600; border: none; border-radius: 8px; padding: 10px 6px; cursor: pointer; text-decoration: none; }
  @media (max-width: 480px) {
    header { padding: 14px 14px; }
    header h1 { font-size: 16px; }
    .grid { grid-template-columns: 1fr; padding: 10px; gap: 12px; }
    .shot { width: 104px; }
    .meta h2 { font-size: 15px; }
    .msg { font-size: 14px; line-height: 1.55; max-height: 260px; }
    .actions { flex-direction: column; gap: 10px; }
    .actions button, .actions a { font-size: 15px; padding: 14px 8px; min-height: 48px; }
    .toast { font-size: 13px; max-width: 92vw; text-align: center; }
  }
  .copy-text { background: #e7e7e7; color: #111; }
  .copy-img { background: #d1e7ff; color: #084298; }
  .open-wa { background: #25d366; color: #fff; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; display: none; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 50; }
  .lightbox img { max-height: 92vh; max-width: 92vw; border-radius: 8px; }
</style>
</head>
<body>
<header>
  <h1>WA Blast — 20 Calon Klien (Exelyn)</h1>
  <p>Salin teks → salin gambar → klik Chat WA (pesan otomatis terisi). Screening: cek screenshot & harga cocok sebelum kirim.</p>
</header>
<div style="max-width:1400px;margin:0 auto;padding:0 16px;">
  <div class="card" style="margin-top:16px;">
    <div class="msg" id="pricelist" style="margin:12px;max-height:none;"></div>
    <div class="actions"><button class="copy-text" onclick="copyPrice()">Salin List Harga Domain</button></div>
  </div>
</div>
<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg"></div>
<script>
let DATA = [];
let PRICE = '';
fetch('harga-domain.txt').then(r => r.text()).then(t => { PRICE = t; document.getElementById('pricelist').textContent = t; });
fetch('messages.json').then(r => r.json()).then(d => { DATA = d; render(); });
function waLink(wa, msg) { return 'https://wa.me/' + wa + '?text=' + encodeURIComponent(msg); }
function render() {
  const g = document.getElementById('grid');
  g.innerHTML = DATA.map((d, i) => `
  <div class="card">
    <div class="top">
      <div class="shot" id="shot-${i}"></div>
      <div class="meta">
        <h2>${d.no}. ${d.nama}</h2>
        <div class="url">${d.url}</div>
        <div class="wa">WA: +${d.wa}</div>
      </div>
    </div>
    <div class="msg" id="msg-${i}"></div>
    <div class="actions">
      <button class="copy-text" onclick="copyText(${i})">Salin Teks</button>
      <button class="copy-img" onclick="copyImg(${i})">Salin Gambar</button>
      <a class="open-wa" target="_blank" href="${waLink(d.wa, d.msg)}">Chat WA</a>
    </div>
  </div>`).join('');
  DATA.forEach((d, i) => {
    document.getElementById('msg-' + i).textContent = d.msg;
    const box = document.getElementById('shot-' + i);
    const img = new Image();
    img.onload = () => { box.innerHTML = ''; img.onclick = () => zoom(img.src); box.appendChild(img); };
    img.onerror = () => { box.innerHTML = '<div class="none">screenshot belum ada</div>'; };
    img.src = 'screenshots/' + d.no + '.png';
    img.alt = d.nama;
  });
}
function toast(t) { const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 1800); }
function copyText(i) { navigator.clipboard.writeText(DATA[i].msg).then(() => toast('Teks ' + DATA[i].nama + ' tersalin')); }
function copyPrice() { navigator.clipboard.writeText(PRICE).then(() => toast('List harga domain tersalin')); }
async function copyImg(i) {
  try {
    const r = await fetch('screenshots/' + DATA[i].no + '.png');
    const b = await r.blob();
    await navigator.clipboard.write([new ClipboardItem({ [b.type]: b })]);
    toast('Gambar ' + DATA[i].nama + ' tersalin');
  } catch (e) { toast('Gagal salin gambar — klik kanan gambar lalu Copy'); }
}
function zoom(src) { const l = document.getElementById('lightbox'); document.getElementById('lightboxImg').src = src; l.style.display = 'flex'; }
</script>
</body>
</html>
